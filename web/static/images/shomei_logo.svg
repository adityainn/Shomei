<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90" fill="none">
  <!-- Shomei Brand Mark -->
  <g id="logo-icon">
    <!-- Green Rounded Square -->
    <rect x="5" y="5" width="80" height="80" rx="20" fill="#15803D" />
    <rect x="5" y="5" width="80" height="80" rx="20" fill="url(#green-gradient)" />
    
    <!-- White Ghost Silhouette -->
    <path d="M 45 22 
             C 32 22 25 31 25 44 
             C 25 50 23 54 21 57 
             C 19 60 21 63 25 62 
             C 28 61 31 59 34 59 
             C 37 59 37 68 41 68 
             C 44 68 45 61 47 61 
             C 49 61 50 68 53 68 
             C 57 68 57 59 60 59 
             C 63 59 66 61 69 62 
             C 73 63 75 60 73 57 
             C 71 54 69 50 69 44 
             C 69 31 62 22 45 22 Z" 
          fill="#FFFFFF" />
          
    <!-- Ghost Eyes (Subtle Cutouts) -->
    <circle cx="39" cy="38" r="2.8" fill="#15803D" />
    <circle cx="51" cy="38" r="2.8" fill="#15803D" />
    
    <!-- Green Verification Checkmark Badge -->
    <circle cx="65" cy="65" r="14" fill="#FFFFFF" />
    <circle cx="65" cy="65" r="11" fill="#16A34A" />
    <path d="M 60 65 L 63.5 68.5 L 70.5 61.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <g id="logo-text" transform="translate(102, 0)">
    <!-- Shomei Wordmark -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#181816" letter-spacing="-0.03em">Shomei</text>
    <text x="122" y="32" font-family="'Newsreader', Georgia, serif" font-size="14" font-style="italic" fill="#575753" font-weight="500">証明</text>
    
    <!-- Green Underline Accent with Gradient -->
    <path d="M 0 52 L 150 52" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Subtle Accent Dots -->
    <circle cx="158" cy="52" r="2" fill="#16A34A" opacity="0.85" />
    <circle cx="166" cy="52" r="1.5" fill="#16A34A" opacity="0.5" />
    <circle cx="172" cy="52" r="1" fill="#16A34A" opacity="0.3" />

    <!-- Tagline: CLEAN. VERIFIED. GONE. -->
    <text x="1" y="70" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#575753" letter-spacing="0.16em">CLEAN. VERIFIED. GONE.</text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="green-gradient" x1="5" y1="5" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#15803D" stop-opacity="0.8" />
    </linearGradient>
  </defs>
</svg>
